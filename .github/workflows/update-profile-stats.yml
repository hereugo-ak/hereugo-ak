name: Update profile stats

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GITHUB_PROFILE_TOKEN: ${{ secrets.GITHUB_PROFILE_TOKEN }}
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Refresh authenticated contribution totals
        run: python3 .github/scripts/update_stats.py

      - name: Commit refreshed README
        run: |
          if git diff --quiet -- README.md; then
            echo "No stats changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile stats"
          git push
